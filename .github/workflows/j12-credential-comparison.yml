name: J12-2 offline credential comparison
on:
  push:
    branches: [feature/j12-ai-integration]
    paths: ['.github/workflows/j12-credential-comparison.yml']
permissions: {}
jobs:
  compare:
    if: github.repository == 'daxenvo/daxenvo-website' && github.ref == 'refs/heads/feature/j12-ai-integration' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Seal SHA-256 for one-time private comparison
        shell: python
        env:
          DSN: ${{ secrets.J12_RUNTIME_DSN }}
        run: |
          import base64, hashlib, os, re, subprocess, sys, tempfile
          value = os.environ.pop('DSN')
          pattern = r'postgresql://daxenvo_ai_runtime[.]mniconjzkvvvwqoxtzwu:([0-9a-f]{64})@aws-1-eu-west-3[.]pooler[.]supabase[.]com:5432/postgres'
          match = re.fullmatch(pattern, value)
          if not match:
              sys.exit('Unexpected credential format')
          public_key = '-----BEGIN PUBLIC KEY-----\nMIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAsumyudxe6QVwRaxsf0ot\naPO4EffqLWo1ml5AxKojNn1idvp6nEuS6qUAhsHVTWhw/N3fFV+1S7vUebObehQ+\nsoXu8wRGbMZx1QadsN9MyrcqypF36n1nja8BxThGZFIa0AvdE4bIs7h2+hKiBHme\nix2pZc40/QuouW4LzHCF8kh9VYP+m41df3A8/T7NN/4oHcXQG0ACxmGk+qpZYznM\nyz9YdSwL5w28vsfksO48o+aki6jsWgnWTfakrJK3MvsSvwjvaw4ewCHfyfQnr4iw\n/JZlkYrT8siVjqcJBvKaTGNlkBIw8U3+4rzRvuqN8E8vpWWuN6iLZOju/9ugYoiK\nNk2+qH7Et/zFOePfNEyu+om0BrPDV3GI/bwvqdlxCnNXlHWWrYkAcLa6LXmmp6Di\n47t1DGoW+Ah6WE41N0nOhWzlzOpwThzvSi4qA+6ex88rZjImAojfrirtMc9aBw5q\n2S7sWvXT7uPoDFUU2xLBg6P68+vWReHmHF7DMCxWGeCVAgMBAAE=\n-----END PUBLIC KEY-----\n'
          with tempfile.NamedTemporaryFile(mode='w') as f:
              f.write(public_key); f.flush()
              sealed = subprocess.run(['openssl','pkeyutl','-encrypt','-pubin','-inkey',f.name,
                  '-pkeyopt','rsa_padding_mode:oaep','-pkeyopt','rsa_oaep_md:sha256'],
                  input=hashlib.sha256(match[1].encode('ascii')).digest(), capture_output=True, check=True)
          print('J12_SEALED=' + base64.b64encode(sealed.stdout).decode('ascii'))
